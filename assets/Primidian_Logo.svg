<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="c3-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0FB6D6"/>
      <stop offset="100%" stop-color="#096E8A"/>
    </linearGradient>
    <linearGradient id="c3-magenta" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4569D"/>
      <stop offset="100%" stop-color="#B81E64"/>
    </linearGradient>
    
    <filter id="c3-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Base Facets (Left and Right background) -->
  <g id="gemstone-body">
    <polygon points="128,10 230,128 128,246 128,10" fill="#B81E64" opacity="0.15"/>
    <polygon points="128,10 128,246 26,128 128,10" fill="#096E8A" opacity="0.2"/>
  </g>

  <!-- Glowing Internal Hex Grid (Forms the P) -->
  <g id="crystalline-p-core" filter="url(#c3-glow)">
    <!-- Cyan Isometric Stem -->
    <polygon points="90,70 128,92 128,208 90,186" fill="url(#c3-cyan)" opacity="0.9"/>
    <!-- Magenta Upper Loop Structure -->
    <polygon points="128,92 176,64 196,98 128,138" fill="url(#c3-magenta)" opacity="0.95"/>
    <polygon points="196,98 176,132 128,104 128,138" fill="url(#c3-magenta)" opacity="0.7"/>
    <!-- Inner Loop Cutout (creates the P hole) -->
    <polygon points="128,104 152,90 164,110 128,120" fill="#000000" opacity="0.5"/>
  </g>

  <!-- Overlapping Foreground Facets (Glass effect) -->
  <g id="facets">
    <!-- Front center glass plane -->
    <polygon points="128,10 176,128 128,246 80,128" fill="#ffffff" opacity="0.05"/>
    <!-- Left edge depth -->
    <polygon points="26,128 80,128 128,246" fill="#000000" opacity="0.2"/>
    <!-- Right edge depth -->
    <polygon points="230,128 176,128 128,246" fill="#000000" opacity="0.3"/>
  </g>

  <g id="highlights">
    <!-- Sharp crystal spine -->
    <polyline points="128,10 128,92" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <polyline points="128,10 230,128 128,246 26,128 Z" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
  </g>
</svg>
