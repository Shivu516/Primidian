<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanShard" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0FB6D6" />
      <stop offset="100%" stop-color="#096E8A" />
    </linearGradient>
    <linearGradient id="magentaShard" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4569D" />
      <stop offset="100%" stop-color="#B81E64" />
    </linearGradient>
    <linearGradient id="coreRefraction" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0FB6D6" />
      <stop offset="50%" stop-color="#F4569D" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#B81E64" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shardGlow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="1.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g id="gemstone-body">
    <!-- Asymmetric Outer Crystal Base -->
    <polygon points="120,40 280,10 440,160 380,480 180,460 80,240" fill="#096E8A" opacity="0.2" />
    <polygon points="280,10 440,160 180,460 120,40" fill="#B81E64" opacity="0.15" />
  </g>

  <g id="internal-facets">
    <!-- Deep background facets setting up the P negative space -->
    <polygon points="160,90 320,50 360,220 220,280" fill="url(#coreRefraction)" opacity="0.4" />
  </g>

  <g id="crystalline-p-core" filter="url(#shardGlow)">
    <!-- Main Vertical Pillar (Stem) -->
    <polygon points="140,80 220,60 260,420 180,440" fill="url(#cyanShard)" />
    
    <!-- Top Geometric Cut (Start of Loop) -->
    <polygon points="220,60 360,100 400,180 250,140" fill="url(#magentaShard)" />
    
    <!-- Bottom Geometric Cut (End of Loop) -->
    <polygon points="400,180 340,300 240,240 250,140" fill="url(#magentaShard)" />
    
    <!-- Internal Cutout to define the bowl of the P -->
    <polygon points="250,140 320,160 300,220 245,200" fill="#1e1e1e" opacity="0.5" />
  </g>

  <g id="highlights-and-edges">
    <polygon points="140,80 220,60 250,140 160,150" fill="#FFFFFF" opacity="0.3" />
    <polyline points="140,80 220,60 360,100 400,180" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6" />
    <line x1="220" y1="60" x2="260" y2="420" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4" />
  </g>
</svg>
